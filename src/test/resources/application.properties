# Configuracao exclusiva dos testes: H2 em memoria, isolado do banco local em ./data
spring.application.name=curadoria-fornecedores-publicos-test

spring.datasource.url=jdbc:h2:mem:curadoria-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.h2.console.enabled=false
