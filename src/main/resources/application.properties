spring.application.name=curadoria-fornecedores-publicos

# Configuracao do banco H2
spring.datasource.url=jdbc:h2:file:./data/curadoria
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carrega associacoes lazy (cnae, natureza, porte, enderecos) em lotes, evitando N+1 na listagem
spring.jpa.properties.hibernate.default_batch_fetch_size=50
